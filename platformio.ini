; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; native* envs are test-only (no main()), so `pio run` must not try to link
; them. `pio test -e <env>` still selects them explicitly.
default_envs = uno, uno328pb, leonardo

[env]
monitor_speed = 250000

build_flags = 
	-D MONITOR_SPEED=${env.monitor_speed}
	-D HARDWARE_REVISION
	; -D SERIAL_DEBUG
	; -D DEBUG_ADDRESS
	-D DEV_TOOLS
	; -D EXTRA_INFO_LOGGING
	
extra_scripts =
	pre:name_firmware.py
	pre:zero_bootloader_reserve.py

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags =
	${env.build_flags}
	-D RURP_BOARD_NAME=\"${this.board}\"
	-D SERIAL_ON_IO
; Real ATmega328P flash size, overriding the board JSON's optiboot-reduced
; 32256 B. The linker therefore no longer protects optiboot's 512 B.
board_upload.maximum_size = 32768

[env:uno328pb]
; ATmega328PB on Uno-shaped hardware. RURP_BOARD_NAME must be the literal
; "uno328pb" and NOT \"${this.board}\", which resolves to ATmega328PB and
; breaks the board-id triple.
platform = atmelavr
board = ATmega328PB
framework = arduino
build_flags =
	${env.build_flags}
	-D RURP_BOARD_NAME=\"uno328pb\"
	-D SERIAL_ON_IO
; Real ATmega328PB flash size. On its own this does NOT move the reported
; ceiling: build.core = MiniCore makes the builder subtract a 384 B
; bootloader reserve AFTER the override. zero_bootloader_reserve.py is what
; actually zeroes that subtraction. The linker no longer protects urclock.
board_upload.maximum_size = 32768

[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
build_flags =
	${env.build_flags}
	-D RURP_BOARD_NAME=\"${this.board}\"
; Leonardo (2.5 KB SRAM) uses the full 1 KB buffer. The host reads
; DATA_BUFFER_SIZE from the FW identity string and sizes its chunks to 1022
; (1024 - CRC8 - decoder NUL slot).
	-D DATA_BUFFER_SIZE=1024
; Compile out eprom.cpp's overprogram call site on THIS TARGET ONLY, to buy
; flash against the ATmega32U4 Caterina cliff at 28672 B. uno/uno328pb keep
; it. Unobservable today (no database row sets overprogram_factor). Do not
; make this uniform across envs without re-measuring leonardo's margin --
; see include/eprom.h's EPROM_OVERPROGRAM_SUPPORTED comment.
	-D EPROM_OVERPROGRAM_SUPPORTED=0
; Real ATmega32U4 flash size, overriding the board JSON's Caterina-reduced
; 28672 B. CONSEQUENCE: the linker no longer protects the top 4096 B, so
; firmware grown past 28672 B is flashed OVER Caterina and the board loses
; USB bootloader entry. There is deliberately no compensating guard.
board_upload.maximum_size = 32768

[env:native]
platform = native
test_framework = unity
; test_filter is a positive allowlist because test_ignore was honoured
; inconsistently by some PlatformIO versions.
;
; This env and native_nodevtools are pinned to the SAME test_filter list,
; and check_size_baseline.py asserts an exact case/suite count on both. Any
; extra native env below must therefore name ONLY its own suite and must
; NOT be added here, nor to default_envs.
test_filter =
	native/avr/test_dispatch
	native/avr/test_not_implemented
	native/avr/test_messages
	native/avr/test_data_input
	native/avr/test_read_timing
	native/avr/test_cobs_data_frame
	native/avr/test_cobs_cmd_frame
	native/avr/test_val_eprom
	native/avr/test_val_eeprom28c
	native/avr/test_val_nor_unlock
	native/avr/test_val_5v_page
	native/avr/test_val_flash_intel
	native/avr/test_val_sram
	native/avr/test_sdp_harness
	native/avr/test_eeprom28c_sdp
	native/avr/test_cmd_admission
build_flags =
	${env.build_flags}
	-std=gnu++17
	-I include
	-I test/native/avr/test_dispatch
	-I test/native/avr/test_not_implemented
	-I test/native/avr/test_messages
	-I test/native/avr/test_data_input
	-I test/native/avr/test_read_timing
	-I test/native/avr/test_cobs_data_frame
	-I test/native/avr/test_cobs_cmd_frame
	-I test/native/avr/test_val_eprom
	-I test/native/avr/test_val_eeprom28c
	-I test/native/avr/test_val_nor_unlock
	-I test/native/avr/test_val_5v_page
	-I test/native/avr/test_val_flash_intel
	-I test/native/avr/test_val_sram
	-I test/native/avr/test_sdp_harness
	-I test/native/avr/test_eeprom28c_sdp
	-I test/native/avr/test_cmd_admission
	-D RURP_BOARD_NAME=\"native\"
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
; Only the sources the host test binary can actually link: AVR-only files
; (src/boards/*, src/dev_tools.cpp, src/eprom_operations.cpp, src/logging.c)
; are excluded and their symbols stubbed by test/native/avr/*/host_stubs.cpp.
; Must stay in lockstep with [env:native_nodevtools].
build_src_filter = +<proms/> +<boards/rurp_serial_utils.cpp> +<json_parser.c> +<operation_utils.cpp>
test_build_src = yes

[env:native_nodevtools]
; Same suites as [env:native], compiled WITHOUT -D DEV_TOOLS, so that
; is_memory_cmd()'s DEV_TOOLS-invariance is proven by actually building and
; running it rather than by reading the source.
;
; build_flags deliberately does NOT inherit ${env.build_flags} -- it spells
; out its own and omits DEV_TOOLS. Keep -D HARDWARE_REVISION: host_stubs_
; common.inc gates four stubs on it and dropping it breaks the SDP suites.
platform = native
test_framework = unity
test_filter =
	native/avr/test_dispatch
	native/avr/test_not_implemented
	native/avr/test_messages
	native/avr/test_data_input
	native/avr/test_read_timing
	native/avr/test_cobs_data_frame
	native/avr/test_cobs_cmd_frame
	native/avr/test_val_eprom
	native/avr/test_val_eeprom28c
	native/avr/test_val_nor_unlock
	native/avr/test_val_5v_page
	native/avr/test_val_flash_intel
	native/avr/test_val_sram
	native/avr/test_sdp_harness
	native/avr/test_eeprom28c_sdp
	native/avr/test_cmd_admission
build_flags =
	-D MONITOR_SPEED=250000
	-D HARDWARE_REVISION
	-std=gnu++17
	-I include
	-I test/native/avr/test_dispatch
	-I test/native/avr/test_not_implemented
	-I test/native/avr/test_messages
	-I test/native/avr/test_data_input
	-I test/native/avr/test_read_timing
	-I test/native/avr/test_cobs_data_frame
	-I test/native/avr/test_cobs_cmd_frame
	-I test/native/avr/test_val_eprom
	-I test/native/avr/test_val_eeprom28c
	-I test/native/avr/test_val_nor_unlock
	-I test/native/avr/test_val_5v_page
	-I test/native/avr/test_val_flash_intel
	-I test/native/avr/test_val_sram
	-I test/native/avr/test_sdp_harness
	-I test/native/avr/test_eeprom28c_sdp
	-I test/native/avr/test_cmd_admission
	-D RURP_BOARD_NAME=\"native\"
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
; Kept in lockstep with [env:native]'s build_src_filter.
build_src_filter = +<proms/> +<boards/rurp_serial_utils.cpp> +<json_parser.c> +<operation_utils.cpp>
test_build_src = yes

[env:native_pinmap_provisional]
; Compiles src/proms/memory.cpp with RURP_PINMAP_PROVISIONAL=1 so a native
; test can prove configure_memory() refuses the is_memory_cmd() commands
; under a provisional pin map. Needs its own env because build_flags are
; environment-scoped -- a #define in a test file cannot retroactively change
; how the shared object was compiled.
;
; Not known to check_build_warnings.py; passing this env name there exits 2.
platform = native
test_framework = unity
test_filter =
	native/avr/test_pinmap_provisional
build_flags =
	${env:native.build_flags}
	-I test/native/avr/test_pinmap_provisional
	-D RURP_PINMAP_PROVISIONAL=1
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
build_src_filter = +<proms/> +<boards/rurp_serial_utils.cpp> +<json_parser.c> +<operation_utils.cpp>
test_build_src = yes

[env:native_trace_v131]
; Captures the pre-change 27C write-loop strobe+timing stream for 0x07/0x08/
; 0x0B as a golden trace.
;
; Do not pass this env name to check_size_baseline.py: it hardcodes
; NATIVE_ENVS and an unknown name raises an uncaught KeyError (exit 1, which
; reads as a false regression). check_build_warnings.py handles it cleanly.
platform = native
test_framework = unity
test_filter =
	native/avr/test_trace_eprom_v131
build_flags =
	${env:native.build_flags}
	-I test/native/avr/test_trace_eprom_v131
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
build_src_filter = +<proms/> +<boards/rurp_serial_utils.cpp> +<json_parser.c> +<operation_utils.cpp>
test_build_src = yes

[env:native_params_v131]
; Exercises the pulse_delay == 0 fallback in configure_eprom and
; eprom_params_for()'s row resolution. No shipped chip yields pulse_delay
; == 0, so this suite is the only oracle for that branch -- no bench run
; can reach it.
platform = native
test_framework = unity
test_filter =
	native/avr/test_eprom_params_v131
build_flags =
	${env:native.build_flags}
	-I test/native/avr/test_eprom_params_v131
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
build_src_filter = +<proms/> +<boards/rurp_serial_utils.cpp> +<json_parser.c> +<operation_utils.cpp>
test_build_src = yes

[env:native_loop_v131]
; Runs test_loop_eprom_v131 (per-byte pulse-to-verify loop) and
; test_vpp_eprom_v131 (EPROM write/init VPP validation). The frozen
; native_trace_v131 fixture cannot verify the loop -- it is RED against it by
; design, since a fixture re-frozen by the change it should catch stops being
; evidence.
;
; No CI coverage: like the other extra native envs, do not pass this env name
; to check_size_baseline.py or check_build_warnings.py.
platform = native
test_framework = unity
test_filter =
	native/avr/test_loop_eprom_v131
	native/avr/test_vpp_eprom_v131
build_flags =
	${env:native.build_flags}
	-I test/native/avr/test_loop_eprom_v131
	-I test/native/avr/test_vpp_eprom_v131
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
build_src_filter = +<proms/> +<boards/rurp_serial_utils.cpp> +<json_parser.c> +<operation_utils.cpp>
test_build_src = yes
