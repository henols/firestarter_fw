; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; native* envs are test-only (no main()), so `pio run` must not try to link
; them. `pio test -e <env>` still selects them explicitly.
default_envs = uno, uno328pb, leonardo

[env]
monitor_speed = 250000

build_flags = 
	-D MONITOR_SPEED=${env.monitor_speed}
	-D HARDWARE_REVISION
	; -D SERIAL_DEBUG
	; -D DEBUG_ADDRESS
	; -D EXTRA_INFO_LOGGING
	
extra_scripts =
	pre:name_firmware.py
	pre:version_from_git.py

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags =
	${env.build_flags}
	-D RURP_BOARD_NAME=\"${this.board}\"
	-D SERIAL_ON_IO
; 1 KB buffer on 2 KB SRAM. Keep it a multiple of 512, the largest 0x05
; page; the leonardo env explains why.
	-D DATA_BUFFER_SIZE=1024

[env:uno328pb]
; ATmega328PB on Uno-shaped hardware. RURP_BOARD_NAME must be the literal
; "uno328pb" and NOT \"${this.board}\", which resolves to ATmega328PB and
; breaks the board-id triple.
platform = atmelavr
board = ATmega328PB
framework = arduino
build_flags =
	${env.build_flags}
	-D RURP_BOARD_NAME=\"uno328pb\"
	-D SERIAL_ON_IO
; 1 KB buffer on 2 KB SRAM. Keep it a multiple of 512, the largest 0x05
; page; the leonardo env explains why.
	-D DATA_BUFFER_SIZE=1024

[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
build_flags =
	${env.build_flags}
	-D RURP_BOARD_NAME=\"${this.board}\"
; Leonardo (2.5 KB SRAM) uses a 1.5 KB buffer. Every MSG_OK_READY ack
; advertises DATA_BUFFER_SIZE, and the host sends data chunks of exactly that
; size. Keep it a multiple of 512: protocol 0x05 refuses a block that is not a
; whole number of pages, and the largest page is 512 B. The EPROM write loop's
; stack bitmap does not grow with this value (see EPROM_PROGRAM_GROUP).
	-D DATA_BUFFER_SIZE=1536
; Compile out eprom.cpp's overprogram call site on THIS TARGET ONLY, to buy
; flash against the ATmega32U4 Caterina cliff at 28672 B. uno/uno328pb keep
; it. Unobservable today (no database row sets overprogram_factor). Do not
; make this uniform across envs without re-measuring leonardo's margin --
; see include/eprom.h's EPROM_OVERPROGRAM_SUPPORTED comment.
	-D EPROM_OVERPROGRAM_SUPPORTED=0

[native_base]
platform = native
test_framework = unity
test_filter =
	native/avr/test_dispatch
	native/avr/test_not_implemented
	native/avr/test_messages
	native/avr/test_data_input
	native/avr/test_command_decode
	native/avr/test_cobs_data_frame
	native/avr/test_cobs_cmd_frame
	native/avr/test_val_eprom
	native/avr/test_val_eeprom28c
	native/avr/test_val_nor_unlock
	native/avr/test_val_5v_page
	native/avr/test_val_flash_intel
	native/avr/test_val_sram
	native/avr/test_sdp_harness
	native/avr/test_eeprom28c_sdp
	native/avr/test_cmd_admission
	native/avr/test_flash_intel_vpp
	native/avr/test_eprom_params_v131
	native/avr/test_hv_route_ceiling
	native/avr/test_verify_error_ids
	native/avr/test_voltage_math
	native/avr/test_config_migrate
	native/avr/test_adc_mux
	native/avr/test_timeout_rollover
	native/avr/test_drivers_hv_safety
	native/avr/test_voltage_math_overflow
	native/avr/test_eprom_vpp
	native/avr/test_vpp_read_level
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
build_src_filter = +<proms/> +<boards/rurp_serial_utils.cpp> +<command_decoder.c> +<operation_utils.cpp> +<rurp_voltage_math.c> +<rurp_config_migrate.cpp>
test_build_src = yes
shared_build_flags =
	-std=gnu++17
	-I include
	-I test/native/avr/test_dispatch
	-I test/native/avr/test_not_implemented
	-I test/native/avr/test_messages
	-I test/native/avr/test_data_input
	-I test/native/avr/test_command_decode
	-I test/native/avr/test_cobs_data_frame
	-I test/native/avr/test_cobs_cmd_frame
	-I test/native/avr/test_val_eprom
	-I test/native/avr/test_val_eeprom28c
	-I test/native/avr/test_val_nor_unlock
	-I test/native/avr/test_val_5v_page
	-I test/native/avr/test_val_flash_intel
	-I test/native/avr/test_val_sram
	-I test/native/avr/test_sdp_harness
	-I test/native/avr/test_eeprom28c_sdp
	-I test/native/avr/test_cmd_admission
	-I test/native/avr/test_flash_intel_vpp
	-I test/native/avr/test_eprom_params_v131
	-I test/native/avr/test_hv_route_ceiling
	-I test/native/avr/test_verify_error_ids
	-I test/native/avr/test_voltage_math
	-I test/native/avr/test_config_migrate
	-I test/native/avr/test_adc_mux
	-I test/native/avr/test_timeout_rollover
	-I test/native/avr/test_drivers_hv_safety
	-I test/native/avr/test_voltage_math_overflow
	-I test/native/avr/test_eprom_vpp
	-I test/native/avr/test_vpp_read_level
	-D RURP_BOARD_NAME=\"native\"
; Small program groups, so a short EPROM test block can span several groups.
; The recorder holds 256 entries, which a 512-byte block would overflow.
	-D EPROM_PROGRAM_GROUP=8

[env:native]
extends = native_base
build_flags =
	${env.build_flags}
	-D DEV_TOOLS=1
	${native_base.shared_build_flags}

[env:native_nodevtools]
extends = native_base
; Only suites whose behaviour depends on DEV_TOOLS; [env:native] runs the rest.
test_filter =
	native/avr/test_cmd_admission
build_flags =
	-D MONITOR_SPEED=250000
	-D HARDWARE_REVISION
	${native_base.shared_build_flags}
