; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 250000

build_flags = 
	-D MONITOR_SPEED=${env.monitor_speed}
	-D HARDWARE_REVISION
	; -D SERIAL_DEBUG 
	; -D DEBUG_ADDRESS
	; -D DEV_TOOLS   ; Disabled to save RAM
	; -D EXTRA_INFO_LOGGING
	-D DISABLE_JSON_SUPPORT    ; Disable JSON protocol support and save memory
	; -D DISABLE_BINARY_PROTOCOL ; Disable binary protocol support and save memory

build_src_filter = +<*> -<json_parser.c>  ; Exclude JSON parser when JSON support disabled
lib_ignore = jsmn                   ; Ignore jsmn library when JSON support disabled
	
extra_scripts = pre:name_firmware.py

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags = 
	${env.build_flags}
	-D RURP_BOARD_NAME=\"${this.board}\"
	-D SERIAL_ON_IO
	-D DATA_BUFFER_SIZE=1024    ; 1K buffer     ; Increased buffer - binary protocol now much more efficient

[env:uno-pb]
platform = atmelavr
board = ATmega328PB
framework = arduino
build_flags = 
	${env.build_flags}
	-D RURP_BOARD_NAME=\"${this.board}\"
	-D SERIAL_ON_IO

[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
build_flags = 
	${env.build_flags}
	-D RURP_BOARD_NAME=\"${this.board}\"
	-D DATA_BUFFER_SIZE=1024

[env:uno-json]
platform = atmelavr
board = uno
framework = arduino
build_flags = 
	-D MONITOR_SPEED=${env.monitor_speed}
	-D HARDWARE_REVISION
	; -D DEV_TOOLS   ; Disabled to save RAM
	-D DISABLE_BINARY_PROTOCOL ; JSON-only build
	-D RURP_BOARD_NAME=\"${this.board}\"
	-D SERIAL_ON_IO
	-D DATA_BUFFER_SIZE=1024    ; 1K buffer
build_src_filter = +<*> -<binary_protocol.cpp>  ; Exclude binary protocol
lib_ignore = 

[env:uno-binary] 
platform = atmelavr
board = uno
framework = arduino
build_flags = 
	-D MONITOR_SPEED=${env.monitor_speed}
	-D HARDWARE_REVISION
	; -D DEV_TOOLS   ; Disabled to save RAM  
	-D DISABLE_JSON_SUPPORT    ; Binary-only build
	-D RURP_BOARD_NAME=\"${this.board}\"
	-D SERIAL_ON_IO
	-D DATA_BUFFER_SIZE=1024    ; 1K buffer     ; Increased buffer - optimized binary protocol allows larger buffer
build_src_filter = +<*> -<json_parser.c>  ; Exclude JSON parser
lib_ignore = jsmn
