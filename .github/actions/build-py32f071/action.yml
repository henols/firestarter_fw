name: Build PY32F071 firmware
description: >
  Install the GNU Arm toolchain, configure and build platform/py32f071.

  D-06: this is the ONLY place in the repo that holds the ARM toolchain
  install + cmake configure + cmake build invocation. A composite action
  runs its steps in the calling job, on the same runner and in the same
  workspace as that job's own checkout -- which is exactly what keeps
  the "same job, after the version is written" property intact: this action
  produces its image inside whichever job calls it, immediately after that
  job's prior steps, with no second checkout to go stale. release.yml writes
  the tag into include/version.h before it calls this action, and the image
  must see that edit. A `workflow_call` reusable workflow runs as a separate
  job with a separate checkout and would not. Do not convert this file to
  `workflow_call`.

  D-05/T-128-11: `continue-on-error` must never appear anywhere in this
  file. It belongs on the call site in `release.yml` only. If it were
  added here, the LOUD `py32f071.yml` gate would silently inherit the
  containment, and D-05's whole loud/soft split between the two workflows
  would collapse without warning.

  S-5: every comment in this file names the decision or requirement that
  produced the line it sits on.
inputs:
  board:
    description: PY32F071 board target
    default: py32f071
    required: false
  deps-dir:
    description: >
      FetchContent base directory, relative to the workspace. Two builds that
      give the same value share one SDK clone. Empty means build/<board>/_deps.
    default: ''
    required: false
outputs:
  hex_path:
    description: Path to the emitted Intel HEX image
    value: ${{ steps.build.outputs.hex_path }}
  sdk_sha:
    description: Resolved FetchContent SDK commit SHA
    value: ${{ steps.build.outputs.sdk_sha }}
runs:
  using: composite
  steps:
    # Composite action run steps require an explicit shell; unlike workflow
    # steps, they have no default shell.
    - id: toolchain
      name: Install GNU Arm toolchain and build tools
      shell: bash
      run: |
        # Skip the install when all tools are present, for example on the
        # second board build in the same job.
        if command -v cmake && command -v ninja \
          && command -v arm-none-eabi-gcc && command -v arm-none-eabi-objcopy; then
          echo "Toolchain is present. Skip the install."
          exit 0
        fi
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          gcc-arm-none-eabi \
          binutils-arm-none-eabi
        # Retain the existing toolchain; binutils provides arm-none-eabi-objcopy
        # for the release image.

    - id: versions
      name: Record tool versions
      shell: bash
      run: |
        set -o pipefail
        {
          arm-none-eabi-gcc --version
          arm-none-eabi-ld --version
          cmake --version
          ninja --version
        } | tee tool-versions.txt
        # Consumed by py32f071.yml's failure-diagnostics upload, which stays
        # in that workflow -- this action does not upload artifacts itself.

    - id: configure
      name: Configure
      shell: bash
      env:
        DEPS_DIR: ${{ inputs.deps-dir || format('build/{0}/_deps', inputs.board) }}
      run: |
        set -o pipefail
        cmake \
          -S platform/py32f071 \
          -B "build/${{ inputs.board }}" \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DRURP_BOARD="${{ inputs.board }}" \
          -DFETCHCONTENT_BASE_DIR:PATH="$PWD/$DEPS_DIR" \
          2>&1 | tee configure.log
        # Composite steps inherit the caller's checked-out workspace.

    - id: build
      name: Build and resolve outputs
      shell: bash
      env:
        DEPS_DIR: ${{ inputs.deps-dir || format('build/{0}/_deps', inputs.board) }}
      run: |
        set -o pipefail
        # One directory per board (henols/firestarter#187): a second board
        # built in the same job must not add a second image to the first one's
        # directory, or the exactly-one-image check below fails.
        BUILD_DIR="build/${{ inputs.board }}"
        cmake --build "$BUILD_DIR" 2>&1 | tee build.log

        # With nullglob, missing images produce zero matches instead of a literal
        # glob. Reject zero or multiple images before publishing.
        shopt -s nullglob
        MATCHES=("$BUILD_DIR"/firestarter_*.hex)
        if [ "${#MATCHES[@]}" -ne 1 ]; then
          echo "::error::expected exactly one $BUILD_DIR/firestarter_*.hex, found ${#MATCHES[@]}: ${MATCHES[*]}"
          exit 1
        fi
        HEX_PATH="${MATCHES[0]}"
        echo "hex_path=${HEX_PATH}" >> "$GITHUB_OUTPUT"
        echo "hex_path: ${HEX_PATH}"

        # REL-04/D-10: sdk_sha. SRC is the FetchContent source dir,
        # MEASURED (not guessed) off CI run 30676982030 (job 91306188205,
        # branch v1.23-py32f071-integration, 2026-08-01) -- ninja object
        # paths under _deps/py32f071_sdk-src/ relative to the build dir.
        # This matches CMake's documented default
        # <binary_dir>/_deps/<lowercaseName>-src. The configure step sets
        # FETCHCONTENT_BASE_DIR to DEPS_DIR, so the source is in DEPS_DIR.
        SRC="$DEPS_DIR/py32f071_sdk-src"
        if [ ! -d "$SRC" ]; then
          # Deliberately non-fatal here: provenance enforcement is REL-04's
          # concern and its hard gate lives in the release job (Plan
          # 128-06), where an empty sdk_sha is caught by a 40-hex guard.
          # Failing the *build* here would turn a FetchContent layout
          # change into a red compile on the LOUD gate for a reason that is
          # not a compile problem. This empty-value path is deliberately
          # non-fatal here and fail-closed downstream -- not a swallowed
          # error.
          echo "::warning::FetchContent SDK source dir not found at ${SRC} -- FetchContent layout may have changed; sdk_sha will be empty"
          echo "sdk_sha=" >> "$GITHUB_OUTPUT"
        else
          RESOLVED=$(git -C "$SRC" rev-parse HEAD)
          echo "sdk_sha=${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "sdk_sha: ${RESOLVED}"
        fi
