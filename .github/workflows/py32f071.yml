name: PY32F071 firmware

on:
  # This workflow is the LOUD ARM gate: no continue-on-error, so it goes red
  # and stays red when the ARM build breaks. release.yml's ARM step is the
  # SOFT copy (continue-on-error: true): it exists only to attach the release
  # asset and must never block the AVR assets. The soft copy is defensible
  # only because this gate does not hide the same failure. continue-on-error
  # comes off release.yml's call site when the target is validated on real
  # silicon.
  #
  # This workflow publishes nothing. Its upload-artifact step attaches the
  # .hex to the run itself, so a branch build stays downloadable.
  push:
    # '**' matches every BRANCH but no tags. Tag pushes belong to release.yml.
    branches: ['**']
  pull_request:
    paths:
      - "platform/py32f071/**"
      - "include/**"
      - "src/**"
      - ".github/workflows/py32f071.yml"
  workflow_dispatch:

# A same-repo PR branch now matches both `push` and the path-filtered
# `pull_request`, so supersede stale runs per ref rather than queueing both to
# completion. Never cancel on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Use the shared composite build action; do not mask failures.
      - name: Build PY32F071 firmware
        id: arm
        uses: ./.github/actions/build-py32f071

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firestarter_py32f071_build_diagnostics
          if-no-files-found: warn
          path: |
            configure.log
            build.log
            tool-versions.txt
            build/py32f071/CMakeCache.txt
            build/py32f071/build.ninja

      # ad47c3b: size goes to the job log, which is worth seeing on every
      # run, and is worth nothing as an artifact -- no longer teed to a file.
      - name: Report firmware size
        run: |
          set -o pipefail
          arm-none-eabi-size \
            build/py32f071/firestarter_py32f071.elf

      # Require the install image to exist and be nonempty.
      - name: Verify the install image exists and is non-empty
        working-directory: build/py32f071
        run: |
          set -euxo pipefail
          test -s firestarter_py32f071.hex

      # Upload the install image for PR board bring-up even without a release;
      # release assets are published by release.yml.
      - name: Upload firmware install image
        uses: actions/upload-artifact@v4
        with:
          name: firestarter_py32f071
          if-no-files-found: error
          path: build/py32f071/firestarter_py32f071.hex