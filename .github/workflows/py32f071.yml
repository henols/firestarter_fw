name: PY32F071 firmware

on:
  # This workflow is the LOUD ARM gate: no continue-on-error, so it goes red
  # and stays red when the ARM build breaks. release.yml's ARM step is the
  # SOFT copy (continue-on-error: true): it exists only to attach the release
  # asset and must never block the AVR assets. The soft copy is defensible
  # only because this gate does not hide the same failure. continue-on-error
  # comes off release.yml's call site when the target is validated on real
  # silicon.
  #
  # This workflow publishes nothing. Its upload-artifact step attaches the
  # .hex to the run itself, so a branch build stays downloadable.
  push:
    # '**' matches every BRANCH but no tags. Tag pushes belong to release.yml.
    branches: ['**']
  pull_request:
    paths:
      - "platform/py32f071/**"
      - "include/**"
      - "src/**"
      - ".github/workflows/py32f071.yml"
      - ".github/actions/build-py32f071/**"
      - "tests/_py32_build.py"
      - "tests/_host_build.py"
      - "tests/test_py32_*.py"
      - "tests/test_micropetal_*.py"
      - "test/native/avr/_shared/frame_ref.h"
  workflow_dispatch:

# Supersede stale runs per ref. Same-repo PRs use their push run below;
# fork PRs use pull_request. Never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: py32f071
            tests: 'tests/test_py32_*.py tests/test_micropetal_*.py'
          - board: micropetal_uno
            tests: 'tests/test_micropetal_*.py'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Use the shared composite build action; do not mask failures.
      - name: Build PY32F071 firmware
        id: arm
        uses: ./.github/actions/build-py32f071
        with:
          board: ${{ matrix.board }}

      - name: Test ARM behavior with actual build definitions
        env:
          FIRESTARTER_PY32_COMPILE_COMMANDS: build/py32f071/compile_commands.json
        run: |
          python3 -m pip install pytest
          python3 -m pytest ${{ matrix.tests }} -v

      # ad47c3b: size goes to the job log, which is worth seeing on every
      # run, and is worth nothing as an artifact -- no longer teed to a file.
      - name: Report firmware size
        run: |
          set -o pipefail
          arm-none-eabi-size \
            build/py32f071/firestarter_${{ matrix.board }}.elf

      # Require the install image to exist and be nonempty.
      - name: Verify the install image exists and is non-empty
        working-directory: build/py32f071
        run: |
          set -euxo pipefail
          test -s firestarter_${{ matrix.board }}.hex

      - name: Record firmware provenance and image checksums
        working-directory: build/py32f071
        run: |
          git rev-parse HEAD > BUILD_COMMIT.txt
          sha256sum firestarter_${{ matrix.board }}.{bin,hex,elf,map} > SHA256SUMS

      # Upload the install image for PR board bring-up even without a release;
      # release assets are published by release.yml.
      - name: Upload firmware install image
        uses: actions/upload-artifact@v4
        with:
          name: firestarter_${{ matrix.board }}
          if-no-files-found: error
          path: |
            build/py32f071/firestarter_${{ matrix.board }}.*
            build/py32f071/BUILD_COMMIT.txt
            build/py32f071/SHA256SUMS

      # Run after uploading the default-safe image: the experimental image
      # is build-checked, never substituted into the normal artifact.
      # Its own build directory keeps it apart from the default image.
      - name: Build all opt-in MicroPetal features
        if: matrix.board == 'micropetal_uno'
        uses: ./.github/actions/build-py32f071
        with:
          board: micropetal_uno
          experimental_micropetal: ON
          build_dir: build/micropetal_uno_full

      # The full build sets ROM touch and full operation in the compile
      # database, so the ROM-touch and full-mode test cases run here.
      - name: Test ARM behavior with the full MicroPetal build
        if: matrix.board == 'micropetal_uno'
        env:
          FIRESTARTER_PY32_COMPILE_COMMANDS: build/micropetal_uno_full/compile_commands.json
        run: |
          python3 -m pytest tests/test_py32_*.py tests/test_micropetal_*.py -v

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firestarter_${{ matrix.board }}_build_diagnostics
          if-no-files-found: warn
          path: |
            configure.log
            build.log
            tool-versions.txt
            build/py32f071/CMakeCache.txt
            build/py32f071/build.ninja
            build/micropetal_uno_full/CMakeCache.txt
            build/micropetal_uno_full/build.ninja
