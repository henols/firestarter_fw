name: Firestarter CI
# CI only. Nothing in this workflow publishes: release.yml publishes, and only
# on a version-tag push.
#
# It builds both image configurations, so a pull request proves what a
# pre-release (DEV_TOOLS=1) and a stable release (no dev tools) would ship.
on:
  push:
    # '**' matches every BRANCH but no tags. Tag pushes belong to release.yml.
    branches: ['**']
    paths-ignore:
    - '**.md'
    - '**.sh'
    - '.gitignore'
    - 'docs/**'
    - 'documents/**'
    - 'images/**'
    - '.vscode/**'
    - '.editorconfig/**'
  pull_request:
    paths-ignore:
    - '**.md'
    - '**.sh'
    - '.gitignore'
    - 'docs/**'
    - 'documents/**'
    - 'images/**'
    - '.vscode/**'
    - '.editorconfig/**'

# A same-repo PR branch matches both `push` and `pull_request`. Supersede stale
# runs per ref, except on main, where a cancelled gate reads as a failed gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 supplies tags required by version_from_git.py;
      # Python behavioral tests do not depend on Git history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio pytest

      # test_messages pins the CRC8 polynomial and the exact wire-frame bytes,
      # so a refactor that breaks the frame contract fails here.
      - name: Run native unit tests (DEV_TOOLS)
        run: pio test -e native

      - name: Run native unit tests (no DEV_TOOLS)
        run: pio test -e native_nodevtools

      - name: Run the Python test tree
        run: pytest tests/ -v

      # The same needle check that release.yml runs on each image: the
      # firestarter_dev_tools_image symbol exists only in an image built with
      # DEV_TOOLS=1 (src/dev_tools.cpp).
      - name: Build the stable configuration (no dev tools)
        run: |
          set -euo pipefail
          pio run
          for ENV in uno uno328pb leonardo; do
            if strings .pio/build/"$ENV"/firestarter_*.elf | grep -Fq -- 'firestarter_dev_tools_image'; then
              echo "::error::$ENV stable image implements the dev commands"
              exit 1
            fi
          done

      - name: Build the pre-release configuration (DEV_TOOLS=1)
        env:
          PLATFORMIO_BUILD_FLAGS: -D DEV_TOOLS=1
        run: |
          set -euo pipefail
          pio run
          for ENV in uno uno328pb leonardo; do
            if ! strings .pio/build/"$ENV"/firestarter_*.elf | grep -Fq -- 'firestarter_dev_tools_image'; then
              echo "::error::$ENV pre-release image does not implement the dev commands"
              exit 1
            fi
          done
